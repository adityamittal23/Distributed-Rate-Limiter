global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: 'rate-limiter-gateways'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'gateway-1:8080'
          - 'gateway-2:8080'
          - 'gateway-3:8080'
        labels:
          application: 'distributed-rate-limiter'
